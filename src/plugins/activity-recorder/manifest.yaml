schemaVersion: 1
id: arkloop.plugins.activity-recorder
name: Activity Recorder
version: 0.2.0
publisher: arkloop
description: Record local desktop activity through the unified activity-record daemon.
host_requirement: desktop_local
platforms: [darwin, linux, windows]

settings:
  - key: mode
    type: select
    default: lightweight
    options: [lightweight, full, custom]
  - key: enable_activity_record
    type: boolean
    default: true
  - key: enable_window_tracking
    type: boolean
    default: true
  - key: enable_clipboard
    type: boolean
    default: true
  - key: enable_clipboard_content
    type: boolean
    default: false
  - key: enable_keyboard
    type: boolean
    default: false
  - key: enable_mouse_tracking
    type: boolean
    default: true
  - key: enable_ax
    type: boolean
    default: true
  - key: enable_screentime
    type: boolean
    default: true
  - key: enable_safari
    type: boolean
    default: true
  - key: enable_shell_history
    type: boolean
    default: true
  - key: idle_threshold_sec
    type: integer
    default: 300
  - key: sync_interval_sec
    type: integer
    default: 300
  - key: snapshot_compaction
    type: boolean
    default: false
  - key: builder_interval_min
    type: integer
    default: 300

skills:
  - skill_key: activity-record
    bundle: skills/activity-record
    version: "0.1.0"

context: context.md
