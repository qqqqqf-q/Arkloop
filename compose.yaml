services:
  # --- Sandbox: Docker 模式 ---
  # 启用条件：profile docker-sandbox（--sandbox docker / auto）
  # 通过用户态 Docker socket 创建 sandbox-agent 容器
  # 通过专用网络连接 sandbox-agent，默认允许外网访问以支持 git clone / curl 等开发任务
  sandbox-agent-image:
    build:
      context: .
      dockerfile: src/services/sandbox/Dockerfile.agent
    image: ${ARKLOOP_SANDBOX_DOCKER_IMAGE:-arkloop/sandbox-agent:dev}
    restart: "no"
    profiles:
      - docker-sandbox
    entrypoint: ["/bin/sh", "-lc", "true"]

  sandbox-browser-image:
    build:
      context: .
      dockerfile: src/services/sandbox/Dockerfile.browser
    image: ${ARKLOOP_SANDBOX_BROWSER_DOCKER_IMAGE:-arkloop/sandbox-browser:dev}
    restart: "no"
    profiles:
      - docker-sandbox
    entrypoint: ["/bin/sh", "-lc", "true"]

  sandbox-docker:
    build:
      context: .
      dockerfile: src/services/sandbox/Dockerfile
    restart: unless-stopped
    profiles:
      - docker-sandbox
    ports:
      - "127.0.0.1:19002:19002"
    environment:
      ARKLOOP_SANDBOX_ADDR: "0.0.0.0:19002"
      ARKLOOP_SANDBOX_PROVIDER: "docker"
      ARKLOOP_SANDBOX_ALLOW_EGRESS: "${ARKLOOP_SANDBOX_ALLOW_EGRESS:-true}"
      ARKLOOP_SANDBOX_DOCKER_IMAGE: "${ARKLOOP_SANDBOX_DOCKER_IMAGE:-arkloop/sandbox-agent:dev}"
      ARKLOOP_SANDBOX_BROWSER_DOCKER_IMAGE: "${ARKLOOP_SANDBOX_BROWSER_DOCKER_IMAGE:-arkloop/sandbox-browser:dev}"
      ARKLOOP_SANDBOX_DOCKER_NETWORK: "arkloop_sandbox_agent_egress"
      ARKLOOP_SANDBOX_SOCKET_DIR: "/run/sandbox"
      ARKLOOP_SANDBOX_MAX_SESSIONS: "${ARKLOOP_SANDBOX_MAX_SESSIONS:-50}"
      ARKLOOP_SANDBOX_AUTH_TOKEN: "${ARKLOOP_SANDBOX_AUTH_TOKEN}"
      ARKLOOP_STORAGE_BACKEND: "${ARKLOOP_STORAGE_BACKEND:-filesystem}"
      ARKLOOP_STORAGE_ROOT: "${ARKLOOP_STORAGE_ROOT:-/var/lib/arkloop/storage}"
      ARKLOOP_S3_ENDPOINT: "${ARKLOOP_S3_ENDPOINT_DOCKER:-}"
      ARKLOOP_S3_ACCESS_KEY: "${ARKLOOP_S3_ACCESS_KEY:-}"
      ARKLOOP_S3_SECRET_KEY: "${ARKLOOP_S3_SECRET_KEY:-}"
      DOCKER_HOST: "unix:///run/docker-host.sock"
    networks:
      - default
      - sandbox_agent_egress
      - sandbox_agent_internal
    volumes:
      - type: bind
        source: ${ARKLOOP_SANDBOX_DOCKER_SOCKET_PATH:-/tmp/arkloop-docker.sock}
        target: /run/docker-host.sock
        read_only: true
        bind:
          create_host_path: false
      - sandbox_sockets:/run/sandbox
      - arkloop_storage:${ARKLOOP_STORAGE_ROOT:-/var/lib/arkloop/storage}
    depends_on:
      sandbox-agent-image:
        condition: service_completed_successfully
      sandbox-browser-image:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:19002/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- SearXNG: Self-hosted metasearch engine ---
  # web_search provider, replaces Tavily API
  searxng:
    image: searxng/searxng:2025.9.29-77fd3ee53
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/patch-settings.sh"]
    profiles:
      - searxng
    volumes:
      - searxng_data:/etc/searxng
      - ./config/searxng/patch-settings.sh:/opt/patch-settings.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --- Firecrawl: Self-hosted web scraper ---
  # web_fetch provider, replaces Jina/Basic fetch
  firecrawl:
    # upstream 不提供版本标签 (https://github.com/firecrawl/firecrawl/issues/1750)
    image: ghcr.io/firecrawl/firecrawl:latest
    restart: unless-stopped
    profiles:
      - firecrawl
    environment:
      REDIS_URL: "redis://firecrawl-redis:6379"
      REDIS_RATE_LIMIT_URL: "redis://firecrawl-redis:6379"
      USE_DB_AUTHENTICATION: "false"
      ALLOW_LOCAL_WEBHOOKS: "true"
      PORT: "19012"
      HOST: "0.0.0.0"
      NUM_WORKERS_PER_QUEUE: "${ARKLOOP_FIRECRAWL_WORKERS:-2}"
      NUQ_WORKER_COUNT: "2"
      PLAYWRIGHT_MICROSERVICE_URL: "http://firecrawl-playwright:3000/chromium"
      NUQ_DATABASE_URL: "postgres://firecrawl:firecrawl@firecrawl-postgres:5432/firecrawl"
      NUQ_RABBITMQ_URL: "amqp://guest:guest@firecrawl-rabbitmq:5672"
    depends_on:
      firecrawl-redis:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_started
      firecrawl-postgres:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:19012/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  firecrawl-playwright:
    image: ghcr.io/browserless/chromium:v2.42.0
    restart: unless-stopped
    profiles:
      - firecrawl
    environment:
      MAX_CONCURRENT_SESSIONS: "${ARKLOOP_FIRECRAWL_MAX_BROWSER_SESSIONS:-5}"
      CONNECTION_TIMEOUT: "60000"

  firecrawl-redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles:
      - firecrawl
    command: >
      redis-server
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 20

  firecrawl-postgres:
    build:
      context: config/firecrawl-postgres
    restart: unless-stopped
    profiles:
      - firecrawl
    environment:
      POSTGRES_USER: firecrawl
      POSTGRES_PASSWORD: firecrawl
      POSTGRES_DB: firecrawl
    volumes:
      - firecrawl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firecrawl"]
      interval: 10s
      timeout: 3s
      retries: 10

  firecrawl-rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    profiles:
      - firecrawl
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  firecrawl_pgdata:
  sandbox_sockets:
  arkloop_storage:
  searxng_data:

networks:
  sandbox_agent_egress:
    name: arkloop_sandbox_agent_egress
  sandbox_agent_internal:
    name: arkloop_sandbox_agent_internal
    internal: true
