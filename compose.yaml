services:
  # --- SearXNG: Self-hosted metasearch engine ---
  # web_search provider, replaces Tavily API
  searxng:
    image: searxng/searxng:2025.9.29-77fd3ee53
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/patch-settings.sh"]
    profiles:
      - searxng
    volumes:
      - searxng_data:/etc/searxng
      - ./config/searxng/patch-settings.sh:/opt/patch-settings.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --- Firecrawl: Self-hosted web scraper ---
  # web_fetch provider, replaces Jina/Basic fetch
  firecrawl:
    # upstream 不提供版本标签 (https://github.com/firecrawl/firecrawl/issues/1750)
    image: ghcr.io/firecrawl/firecrawl:latest
    restart: unless-stopped
    profiles:
      - firecrawl
    environment:
      REDIS_URL: "redis://firecrawl-redis:6379"
      REDIS_RATE_LIMIT_URL: "redis://firecrawl-redis:6379"
      USE_DB_AUTHENTICATION: "false"
      ALLOW_LOCAL_WEBHOOKS: "true"
      PORT: "19012"
      HOST: "0.0.0.0"
      NUM_WORKERS_PER_QUEUE: "${ARKLOOP_FIRECRAWL_WORKERS:-2}"
      NUQ_WORKER_COUNT: "2"
      PLAYWRIGHT_MICROSERVICE_URL: "http://firecrawl-playwright:3000/chromium"
      NUQ_DATABASE_URL: "postgres://firecrawl:firecrawl@firecrawl-postgres:5432/firecrawl"
      NUQ_RABBITMQ_URL: "amqp://guest:guest@firecrawl-rabbitmq:5672"
    depends_on:
      firecrawl-redis:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_started
      firecrawl-postgres:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:19012/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s

  firecrawl-playwright:
    image: ghcr.io/browserless/chromium:v2.42.0
    restart: unless-stopped
    profiles:
      - firecrawl
    environment:
      MAX_CONCURRENT_SESSIONS: "${ARKLOOP_FIRECRAWL_MAX_BROWSER_SESSIONS:-5}"
      CONNECTION_TIMEOUT: "60000"

  firecrawl-redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles:
      - firecrawl
    command: >
      redis-server
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 20

  firecrawl-postgres:
    build:
      context: config/firecrawl-postgres
    restart: unless-stopped
    profiles:
      - firecrawl
    environment:
      POSTGRES_USER: firecrawl
      POSTGRES_PASSWORD: firecrawl
      POSTGRES_DB: firecrawl
    volumes:
      - firecrawl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firecrawl"]
      interval: 10s
      timeout: 3s
      retries: 10

  firecrawl-rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    profiles:
      - firecrawl
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  firecrawl_pgdata:
  searxng_data:
